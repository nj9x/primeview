<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>PrimeView — charts</title>
    <link data-trunk rel="icon" href="../packaging/icons/icon-256.png" />
    <link data-trunk rel="rust" href="Cargo.toml" data-bin="primeview" data-wasm-opt="2" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #0e1015; }
      #primeview_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #848a96; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
    </style>

  <body>
    <canvas id="primeview_canvas"></canvas>
    <div id="loading"><p>Loading PrimeView…</p></div>
  </body>
