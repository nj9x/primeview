[package]
name = "primeview"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eframe = { version = "0.37.0", features = ["persistence"] }
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
primeview-chart = { version = "0.1.0", path = "../crates/primeview-chart" }
primeview-core = { version = "0.1.0", path = "../crates/primeview-core" }
primeview-data = { version = "0.1.0", path = "../crates/primeview-data" }
web-time = "1.1.0"
primeview-alerts = { version = "0.1.0", path = "../crates/primeview-alerts" }
primeview-script = { version = "0.1.0", path = "../crates/primeview-script" }
serde_json = "1.0.154"
ehttp = "0.7.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.80"
