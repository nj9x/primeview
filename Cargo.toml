[workspace]
resolver = "3"
members = [
    "crates/primeview-core",
    "crates/primeview-data",
    "crates/primeview-chart",
    "crates/primeview-script",
    "crates/primeview-alerts",
    "server",
    "app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"

[profile.release.package."*"]
opt-level = 3

# Keep debug builds snappy for rendering
[profile.dev.package."*"]
opt-level = 2
